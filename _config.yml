# --- Site identity -----------------------------------------------------------
# Kept short on purpose: jekyll-seo-tag appends "| {{ site.title }}" to every
# page <title> and uses it for og:site_name / the WebSite JSON-LD name, so a
# long value here doubles up on every page and gets truncated in search results.
title: "Hiyd"
tagline: "The Jekyll Companion App"
description: >-
  Hiyd is a fast, private iOS app for drafting Markdown posts with YAML front
  matter and publishing them straight to your Jekyll site on GitHub. A Chrome
  extension captures link posts from the browser.
url: "https://hiyd.uk"
baseurl: ""
lang: en-GB
copyright: "Hiyd UK"
author: "thechelsuk"

# --- Build ------------------------------------------------------------------
highlighter: rouge
timezone: Europe/London
encoding: UTF-8
future: false
permalink: /:slug/

github:
  repository_url: https://github.com/thechelsuk/uk.hiyd
  branch: main

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jemoji
# Note: no jekyll-sitemap — /sitemap.xml is a Liquid template in the repo root.

# --- Social / app ----------------------------------------------------------
app_store_url: "https://apps.apple.com/gb/app/hiyd/id6746853559"
app_store_id: "6746853559"
chrome_store_url: "https://chromewebstore.google.com/detail/hiyd/hkeklhoojnogpfmiikadpcmkmpldhpce"
min_ios_version: "18.6"

# jekyll-seo-tag
logo: /assets/hiyd-logo-90.png
# Social share card (og:image / twitter:image). Square 1024x1024 app icon is
# used for the Organization/structured-data logo instead — see logo: above.
image:
  path: /assets/og-card.png
  width: 1200
  height: 630
  alt: "Hiyd — the Jekyll companion app for iPhone and iPad"

# `social` is consumed both by our templates (reddit/bluesky/github) and by
# jekyll-seo-tag (name/links -> Organization sameAs).
social:
  name: Hiyd
  reddit: "https://reddit.com/r/hiydapp"
  bluesky: "https://bsky.app/profile/hiyd.uk"
  github: "https://github.com/thechelsuk/uk.hiyd"
  links:
    - https://bsky.app/profile/hiyd.uk
    - https://reddit.com/r/hiydapp
    - https://github.com/thechelsuk/uk.hiyd

# --- Navigation ----------------------------------------------------------
nav:
  - title: Features
    url: /#features
  - title: Guides
    url: /guides/
  - title: FAQ
    url: /faq/
  - title: Support
    url: /support/

# --- Collections ---------------------------------------------------------
collections:
  guides:
    output: true
    permalink: /guides/:slug/

defaults:
  - scope: { path: "" }
    values:
      layout: "page"
      image: { path: "/assets/og-card.png", width: 1200, height: 630, alt: "Hiyd — the Jekyll companion app for iPhone and iPad" }
  - scope: { path: "", type: "guides" }
    values: { layout: "guide" }
  - scope: { path: "index.html" }
    values: { layout: "home" }

# --- Files ---------------------------------------------------------------
include:
  - ".well-known"
  - assets/
exclude:
  - CNAME
  - README.md
  - LICENCE.md
  - LICENSE.md
  - SECURITY.md
  - Gemfile
  - Gemfile.lock
  - .jekyll-cache/
  - node_modules/
  - vendor/
